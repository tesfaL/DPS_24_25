plugins {
    id "com.google.protobuf" version "0.9.4" // for gRPC
    id "java"
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group 'it.unimi.di.dps'
version '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'

    // gRPC Dependencies
    // protobuf-java 3.25.5 — fixes DoS CVE (was < 3.25.5)
    implementation 'com.google.protobuf:protobuf-java:3.25.5'
    // grpc 1.75.0 — fixes grpc-netty-shaded MadeYouReset DDoS and grpc-protobuf assertion CVEs
    implementation 'io.grpc:grpc-netty-shaded:1.75.0'
    implementation 'io.grpc:grpc-protobuf:1.75.0'
    implementation 'io.grpc:grpc-stub:1.75.0'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // REST Dependencies (Spring Boot Web)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // JSON serialisation
    implementation 'com.google.code.gson:gson:2.10.1'

    // MQTT Dependencies
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}

// Include gRPC-generated sources
sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
        proto {
            srcDir 'src/main/proto'
        }
    }
}

// gRPC / Protobuf code generation (platform-independent artifact)
protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.5'
    }

    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.75.0'
        }
    }

    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

test {
    useJUnitPlatform()
}