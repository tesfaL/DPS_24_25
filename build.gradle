plugins {
    id "com.google.protobuf" version "0.9.4" // for GRPC
    id "java"
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.1.4'
}

group 'org.example'
version '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.6.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'

    // GRPC Dependencies
    implementation group: 'com.google.protobuf', name: 'protobuf-java', version: '3.13.0'
    implementation group: 'io.grpc', name: 'grpc-all', version: '1.25.0'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    implementation 'com.google.code.gson:gson:2.7'

    // REST Dependencies
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // MQTT Dependencies
    implementation group: 'org.eclipse.paho', name: 'org.eclipse.paho.client.mqttv3', version: '1.2.5'
}

// GRPC
sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
    }
}

// Detect OS/arch for protoc and grpc-java classifiers
def osName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
def osArch = System.getProperty("os.arch").toLowerCase(Locale.ROOT)
def protocClassifier
if (osName.contains("mac") || osName.contains("darwin")) {
    protocClassifier = osArch.contains("aarch64") ? "osx-aarch_64" : "osx-x86_64"
} else if (osName.contains("win")) {
    protocClassifier = "windows-x86_64"
} else {
    protocClassifier = osArch.contains("aarch64") ? "linux-aarch_64" : "linux-x86_64"
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.13.0:${protocClassifier}"
    }

    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.25.0:${protocClassifier}"
        }
    }

    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

springBoot {
    mainClass = 'Main'
}

test {
    useJUnitPlatform()
}